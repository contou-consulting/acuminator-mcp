[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acuminator-mcp"
version = "0.1.0"
description = "MCP server exposing the Acuminator static analyzer for Acumatica ERP customizations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Contou Consulting", email = "engineering@contou.com" }]
keywords = ["mcp", "acumatica", "acuminator", "static-analysis", "roslyn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1.350",
]

[project.scripts]
acuminator-mcp = "acuminator_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/contou-consulting/acuminator-mcp"
Repository = "https://github.com/contou-consulting/acuminator-mcp"
Issues = "https://github.com/contou-consulting/acuminator-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acuminator_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
